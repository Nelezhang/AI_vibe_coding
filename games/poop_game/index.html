<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Robot Slither Arena</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="hud">
      <div class="brand">Robot Slither Arena</div>
      <div class="stats">
        <span>Score: <strong id="score">0</strong></span>
        <span>Health: <strong id="health">5</strong></span>
        <span>Time: <strong id="time">∞</strong></span>
      </div>
    </div>

    <canvas id="gameCanvas" width="880" height="520"></canvas>

    <div class="controls">
      <button id="startButton" type="button">Start</button>
      <button id="resetButton" type="button">Reset</button>
    </div>
    <p class="instructions">Steer: mouse or WASD / arrows · Hold Space to boost (spends score and body)</p>

    <script src="script.js"></script>
  </body>
</html>
