{% extends "base.html" %}
{% block title %}{{ post.title }} · Small Press{% endblock %}
{% block content %}
  <article class="full-post">
    <a class="back-link" href="{{ url_for('index') }}">← All posts</a>
    <p class="post-meta">By {{ post.username }} · {{ post.created_at }}</p>
    <h1>{{ post.title }}</h1>
    <div class="post-body">{{ post.body }}</div>
    {% if g.user and g.user.id == post.author_id %}
      <div class="post-actions">
        <a class="button secondary" href="{{ url_for('edit_post', post_id=post.id) }}">Edit post</a>
        <form action="{{ url_for('delete_post', post_id=post.id) }}" method="post"
              onsubmit="return confirm('Delete this post permanently?');">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="button danger" type="submit">Delete post</button>
        </form>
      </div>
    {% endif %}
  </article>
{% endblock %}
